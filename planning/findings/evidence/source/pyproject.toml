[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valid-point"
version = "0.0.0"
description = "Reproducible research on sender conformity in cooperative LiDAR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nbconvert>=7.17.2",
    "numpy>=2,<3",
]

[project.optional-dependencies]
# S00/S01 notebook execution, figure export and invariant tests.
bootstrap = [
  "ipykernel>=6,<8",
  "nbclient>=0.10,<1",
  "nbformat>=5,<6",
  "matplotlib>=3.10,<4",
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
